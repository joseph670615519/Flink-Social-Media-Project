<!DOCTYPE html>
<html>
<head>
    <title>File Input Test</title>
</head>
<body>
    <h2>🧪 File Input Test</h2>
    
    <p>Test 1: Simple file input</p>
    <input type="file" accept="image/*" onchange="console.log('File selected:', this.files[0])">
    
    <p>Test 2: Label + hidden input (like our app)</p>
    <input type="file" id="test-input" accept="image/*" style="display: none" onchange="console.log('Hidden input:', this.files[0])">
    <label for="test-input" style="padding: 10px; background: #007bff; color: white; cursor: pointer; border-radius: 4px;">
        Click Me
    </label>
    
    <p>Test 3: Button with click trigger</p>
    <input type="file" id="test-input2" accept="image/*" style="display: none" onchange="console.log('Button input:', this.files[0])">
    <button onclick="document.getElementById('test-input2').click()" style="padding: 10px; cursor: pointer;">
        Upload Image
    </button>
    
    <script>
        console.log('File input test page loaded');
        console.log('Test all three methods above');
        
        // Additional debugging
        window.addEventListener('click', (e) => {
            console.log('Click detected on:', e.target);
        });
    </script>
</body>
</html>
